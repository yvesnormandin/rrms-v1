# Tool tests for rrms-v1 (RRMS Alarm Monitoring Agent).
#
# Covers the three Coverage Map "Tool test" rows (TDD section 6):
#   - verify_passcode returns correct true/false per account (valid + invalid)
#   - lookup_accounts_by_caller returns one vs. many per caller
#   - cancel_alarm / put_account_on_test / send_confirmation_sms confirmations
# Plus error paths the tool code implements (unknown phone, no resolved account,
# unverified passcode, no active alarm, out-of-range / missing duration).
#
# Expectation paths use the EXACT return-dict keys from each tool's
# python_function/python_code.py. Tools read context.state (caller_phone,
# _caller_accounts, _resolved_account), so state is populated via `variables:`
# since tool tests run in isolation. _caller_accounts/_resolved_account are
# JSON-serialized strings (the tools json.loads them). _MOCK_ACCOUNTS lives
# ONLY in lookup_accounts_by_caller; verify_passcode reads _caller_accounts.

tests:
  # ---------------------------------------------------------------------------
  # lookup_accounts_by_caller -- one vs. many, and unknown caller error path.
  # ---------------------------------------------------------------------------
  - name: lookup_single_site_caller_returns_one_account
    tool: lookup_accounts_by_caller
    args: {}
    variables:
      caller_phone: "+15125550142"
    expectations:
      response:
        - path: "$.result.status"
          operator: equals
          value: "success"
        - path: "$.result.company_name"
          operator: equals
          value: "Johnson Verizon Store"
        - path: "$.result.account_count"
          operator: equals
          value: 1
        - path: "$.result.accounts"
          operator: length_equals
          value: 1
        - path: "$.result.accounts[0].branch_name"
          operator: equals
          value: "Johnson Verizon Store"
        - path: "$.result.accounts[0].account_id"
          operator: equals
          value: "RRMS-1001"
        - path: "$.result.accounts[0].has_active_alarm"
          operator: equals
          value: true
        - path: "$.result.accounts[0].account_last_digits"
          operator: equals
          value: "118"

  - name: lookup_multi_location_caller_returns_many_accounts
    tool: lookup_accounts_by_caller
    args: {}
    variables:
      caller_phone: "+12145550199"
    expectations:
      response:
        - path: "$.result.status"
          operator: equals
          value: "success"
        - path: "$.result.company_name"
          operator: equals
          value: "Lone Star Communications"
        - path: "$.result.account_count"
          operator: equals
          value: 3
        - path: "$.result.accounts"
          operator: length_equals
          value: 3
        - path: "$.result.accounts[0].branch_name"
          operator: equals
          value: "Dallas"
        - path: "$.result.accounts[0].street_address"
          operator: equals
          value: "123 Main Street"
        - path: "$.result.accounts[0].account_last_digits"
          operator: equals
          value: "345"

  - name: lookup_unknown_caller_returns_error_with_agent_action
    tool: lookup_accounts_by_caller
    args: {}
    variables:
      caller_phone: "+19995550000"
    expectations:
      response:
        - path: "$.result.status"
          operator: equals
          value: "error"
        - path: "$.result.error"
          operator: contains
          value: "No account linked"
        - path: "$.result.agent_action"
          operator: is_not_null

  # ---------------------------------------------------------------------------
  # verify_passcode -- valid / invalid per account, plus no-account error path.
  # ---------------------------------------------------------------------------
  - name: verify_passcode_valid_single_site_by_phone
    tool: verify_passcode
    args:
      passcode: "Sunset"
    variables:
      _caller_accounts: '[{"account_id": "RRMS-1001", "branch_name": "Johnson Verizon Store", "street_address": "742 Commerce Drive", "account_last_digits": "118", "passcode": "Sunset", "has_active_alarm": true, "dispatch_status": "not dispatched"}]'
    expectations:
      response:
        - path: "$.result.status"
          operator: equals
          value: "success"
        - path: "$.result.verified"
          operator: equals
          value: true
        - path: "$.result.branch_name"
          operator: equals
          value: "Johnson Verizon Store"
        - path: "$.result.account_last_digits"
          operator: equals
          value: "118"

  - name: verify_passcode_valid_multi_location_by_account_id
    tool: verify_passcode
    args:
      passcode: "bluebird"
      account_id: "RRMS-2001"
    variables:
      _caller_accounts: '[{"account_id": "RRMS-2001", "branch_name": "Dallas", "street_address": "123 Main Street", "account_last_digits": "345", "passcode": "Bluebird", "has_active_alarm": false, "dispatch_status": "not dispatched"}, {"account_id": "RRMS-2002", "branch_name": "Fort Worth", "street_address": "456 Oak Avenue", "account_last_digits": "782", "passcode": "Maple", "has_active_alarm": false, "dispatch_status": "not dispatched"}, {"account_id": "RRMS-2003", "branch_name": "Plano", "street_address": "789 Elm Street", "account_last_digits": "614", "passcode": "Harbor", "has_active_alarm": false, "dispatch_status": "not dispatched"}]'
    expectations:
      response:
        - path: "$.result.status"
          operator: equals
          value: "success"
        - path: "$.result.verified"
          operator: equals
          value: true
        - path: "$.result.branch_name"
          operator: equals
          value: "Dallas"
        - path: "$.result.account_last_digits"
          operator: equals
          value: "345"

  # ASR word-splitting: spoken "Bluebird" is often transcribed "Blue Bird".
  # The tool normalizes whitespace so real audio callers still verify.
  - name: verify_passcode_asr_word_split_normalized
    tool: verify_passcode
    args:
      passcode: "Blue Bird"
      account_id: "RRMS-2001"
    variables:
      _caller_accounts: '[{"account_id": "RRMS-2001", "branch_name": "Dallas", "street_address": "123 Main Street", "account_last_digits": "345", "passcode": "Bluebird", "has_active_alarm": false, "dispatch_status": "not dispatched"}, {"account_id": "RRMS-2002", "branch_name": "Fort Worth", "street_address": "456 Oak Avenue", "account_last_digits": "782", "passcode": "Maple", "has_active_alarm": false, "dispatch_status": "not dispatched"}, {"account_id": "RRMS-2003", "branch_name": "Plano", "street_address": "789 Elm Street", "account_last_digits": "614", "passcode": "Harbor", "has_active_alarm": false, "dispatch_status": "not dispatched"}]'
    expectations:
      response:
        - path: "$.result.status"
          operator: equals
          value: "success"
        - path: "$.result.verified"
          operator: equals
          value: true

  # Fuzzy matching: a single misheard character (edit distance 1) is accepted —
  # real callers' passcodes get transcribed with small ASR errors.
  - name: verify_passcode_one_edit_accepted
    tool: verify_passcode
    args:
      passcode: "Sunsut"
    variables:
      _caller_accounts: '[{"account_id": "RRMS-1001", "branch_name": "Johnson Verizon Store", "street_address": "742 Commerce Drive", "account_last_digits": "118", "passcode": "Sunset", "has_active_alarm": true, "dispatch_status": "not dispatched"}]'
    expectations:
      response:
        - path: "$.result.status"
          operator: equals
          value: "success"
        - path: "$.result.verified"
          operator: equals
          value: true

  # Two edits away is ALSO accepted — tolerance is <= 2, absorbing heavier ASR
  # mishearings like "blueberg" for "Bluebird" (two substituted letters).
  - name: verify_passcode_two_edits_accepted
    tool: verify_passcode
    args:
      passcode: "Blueberg"
      account_id: "RRMS-2001"
    variables:
      _caller_accounts: '[{"account_id": "RRMS-2001", "branch_name": "Dallas", "street_address": "123 Main Street", "account_last_digits": "345", "passcode": "Bluebird", "has_active_alarm": false, "dispatch_status": "not dispatched"}, {"account_id": "RRMS-2002", "branch_name": "Fort Worth", "street_address": "456 Oak Avenue", "account_last_digits": "782", "passcode": "Maple", "has_active_alarm": false, "dispatch_status": "not dispatched"}]'
    expectations:
      response:
        - path: "$.result.status"
          operator: equals
          value: "success"
        - path: "$.result.verified"
          operator: equals
          value: true

  # ...but three edits away is rejected — the tolerance is exactly <= 2.
  - name: verify_passcode_three_edits_rejected
    tool: verify_passcode
    args:
      passcode: "Sonsax"
    variables:
      _caller_accounts: '[{"account_id": "RRMS-1001", "branch_name": "Johnson Verizon Store", "street_address": "742 Commerce Drive", "account_last_digits": "118", "passcode": "Sunset", "has_active_alarm": true, "dispatch_status": "not dispatched"}]'
    expectations:
      response:
        - path: "$.result.status"
          operator: equals
          value: "success"
        - path: "$.result.verified"
          operator: equals
          value: false

  - name: verify_passcode_invalid_passcode_returns_unverified
    tool: verify_passcode
    args:
      passcode: "WrongWord"
    variables:
      _caller_accounts: '[{"account_id": "RRMS-1001", "branch_name": "Johnson Verizon Store", "street_address": "742 Commerce Drive", "account_last_digits": "118", "passcode": "Sunset", "has_active_alarm": true, "dispatch_status": "not dispatched"}]'
    expectations:
      response:
        - path: "$.result.status"
          operator: equals
          value: "success"
        - path: "$.result.verified"
          operator: equals
          value: false
        - path: "$.result.agent_action"
          operator: is_not_null

  - name: verify_passcode_no_resolved_account_returns_error
    tool: verify_passcode
    args:
      passcode: "Sunset"
    expectations:
      response:
        - path: "$.result.status"
          operator: equals
          value: "error"
        - path: "$.result.verified"
          operator: equals
          value: false
        - path: "$.result.agent_action"
          operator: is_not_null

  # ---------------------------------------------------------------------------
  # cancel_alarm -- success (verified + active alarm), gate, and no-alarm paths.
  # _resolved_account is the JSON string the tool json.loads().
  # ---------------------------------------------------------------------------
  - name: cancel_alarm_success_reports_dispatch_status
    tool: cancel_alarm
    args: {}
    variables:
      _resolved_account: '{"account_id": "RRMS-1001", "branch_name": "Johnson Verizon Store", "street_address": "742 Commerce Drive", "account_last_digits": "118", "has_active_alarm": true, "dispatch_status": "not dispatched", "passcode_verified": true}'
    expectations:
      response:
        - path: "$.result.status"
          operator: equals
          value: "success"
        - path: "$.result.canceled"
          operator: equals
          value: true
        - path: "$.result.branch_name"
          operator: equals
          value: "Johnson Verizon Store"
        - path: "$.result.dispatch_status"
          operator: equals
          value: "not dispatched"
        - path: "$.result.message"
          operator: contains
          value: "Police were not dispatched"

  - name: cancel_alarm_blocked_when_passcode_not_verified
    tool: cancel_alarm
    args: {}
    variables:
      _resolved_account: '{"account_id": "RRMS-1001", "branch_name": "Johnson Verizon Store", "street_address": "742 Commerce Drive", "account_last_digits": "118", "has_active_alarm": true, "passcode_verified": false}'
    expectations:
      response:
        - path: "$.result.status"
          operator: equals
          value: "error"
        - path: "$.result.error"
          operator: contains
          value: "Passcode not verified"
        - path: "$.result.agent_action"
          operator: is_not_null

  - name: cancel_alarm_no_active_alarm_informs_caller
    tool: cancel_alarm
    args: {}
    variables:
      _resolved_account: '{"account_id": "RRMS-2001", "branch_name": "Dallas", "street_address": "123 Main Street", "account_last_digits": "345", "has_active_alarm": false, "passcode_verified": true}'
    expectations:
      response:
        - path: "$.result.status"
          operator: equals
          value: "no_active_alarm"
        - path: "$.result.branch_name"
          operator: equals
          value: "Dallas"
        - path: "$.result.agent_action"
          operator: is_not_null

  # ---------------------------------------------------------------------------
  # put_account_on_test -- success, out-of-range, missing duration, gate.
  # ---------------------------------------------------------------------------
  - name: put_account_on_test_success_confirms_duration_and_last_digits
    tool: put_account_on_test
    args:
      duration_minutes: 60
      duration_label: "one hour"
    variables:
      _resolved_account: '{"account_id": "RRMS-2001", "branch_name": "Dallas", "street_address": "123 Main Street", "account_last_digits": "345", "has_active_alarm": false, "passcode_verified": true}'
    expectations:
      response:
        - path: "$.result.status"
          operator: equals
          value: "success"
        - path: "$.result.on_test"
          operator: equals
          value: true
        - path: "$.result.branch_name"
          operator: equals
          value: "Dallas"
        - path: "$.result.account_last_digits"
          operator: equals
          value: "345"
        - path: "$.result.duration_minutes"
          operator: equals
          value: 60
        - path: "$.result.duration_label"
          operator: equals
          value: "one hour"
        - path: "$.result.message"
          operator: contains
          value: "on test for one hour"

  - name: put_account_on_test_out_of_range_duration_rejected
    tool: put_account_on_test
    args:
      duration_minutes: 600
    variables:
      _resolved_account: '{"account_id": "RRMS-2001", "branch_name": "Dallas", "street_address": "123 Main Street", "account_last_digits": "345", "has_active_alarm": false, "passcode_verified": true}'
    expectations:
      response:
        - path: "$.result.status"
          operator: equals
          value: "error"
        - path: "$.result.error"
          operator: contains
          value: "out of range"
        - path: "$.result.agent_action"
          operator: is_not_null

  - name: put_account_on_test_missing_duration_asks_caller
    tool: put_account_on_test
    args:
      duration_minutes: 0
    variables:
      _resolved_account: '{"account_id": "RRMS-2001", "branch_name": "Dallas", "street_address": "123 Main Street", "account_last_digits": "345", "has_active_alarm": false, "passcode_verified": true}'
    expectations:
      response:
        - path: "$.result.status"
          operator: equals
          value: "error"
        - path: "$.result.error"
          operator: contains
          value: "Missing duration"
        - path: "$.result.agent_action"
          operator: is_not_null

  - name: put_account_on_test_blocked_when_passcode_not_verified
    tool: put_account_on_test
    args:
      duration_minutes: 60
    variables:
      _resolved_account: '{"account_id": "RRMS-2001", "branch_name": "Dallas", "street_address": "123 Main Street", "account_last_digits": "345", "has_active_alarm": false, "passcode_verified": false}'
    expectations:
      response:
        - path: "$.result.status"
          operator: equals
          value: "error"
        - path: "$.result.error"
          operator: contains
          value: "Passcode not verified"
        - path: "$.result.agent_action"
          operator: is_not_null

  # ---------------------------------------------------------------------------
  # send_confirmation_sms -- success (mock send) and no-phone error path.
  # ---------------------------------------------------------------------------
  - name: send_confirmation_sms_success_returns_sent
    tool: send_confirmation_sms
    args:
      message_summary: "Dallas branch on test for one hour"
    variables:
      caller_phone: "+12145550199"
      _resolved_account: '{"account_id": "RRMS-2001", "branch_name": "Dallas", "street_address": "123 Main Street", "account_last_digits": "345", "has_active_alarm": false, "passcode_verified": true}'
    expectations:
      response:
        - path: "$.result.status"
          operator: equals
          value: "success"
        - path: "$.result.sent"
          operator: equals
          value: true
        - path: "$.result.to"
          operator: equals
          value: "+12145550199"
        - path: "$.result.branch_name"
          operator: equals
          value: "Dallas"
        - path: "$.result.message"
          operator: contains
          value: "confirmation text"

  - name: send_confirmation_sms_no_phone_returns_error
    tool: send_confirmation_sms
    args:
      message_summary: "Dallas branch on test for one hour"
    expectations:
      response:
        - path: "$.result.status"
          operator: equals
          value: "error"
        - path: "$.result.sent"
          operator: equals
          value: false
        - path: "$.result.agent_action"
          operator: is_not_null

  # ---------------------------------------------------------------------------
  # set_language -- records the caller's explicitly requested language.
  # EN/ES (with common spellings) accepted; anything else is an error the agent
  # uses to decline and stay in scope.
  # ---------------------------------------------------------------------------
  - name: set_language_spanish_succeeds
    tool: set_language
    args:
      language: "Spanish"
    expectations:
      response:
        - path: "$.result.status"
          operator: equals
          value: "success"
        - path: "$.result.language"
          operator: equals
          value: "Spanish"

  - name: set_language_english_succeeds
    tool: set_language
    args:
      language: "English"
    expectations:
      response:
        - path: "$.result.status"
          operator: equals
          value: "success"
        - path: "$.result.language"
          operator: equals
          value: "English"

  - name: set_language_native_spelling_espanol_succeeds
    tool: set_language
    args:
      language: "español"
    expectations:
      response:
        - path: "$.result.status"
          operator: equals
          value: "success"
        - path: "$.result.language"
          operator: equals
          value: "Spanish"

  - name: set_language_unsupported_returns_error
    tool: set_language
    args:
      language: "French"
    expectations:
      response:
        - path: "$.result.status"
          operator: equals
          value: "error"
        - path: "$.result.language"
          operator: equals
          value: ""
        - path: "$.result.agent_action"
          operator: is_not_null
